plugins { id 'com.android.application' }

android {
    namespace 'com.orya.mobile'
    compileSdk 36
    defaultConfig {
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-beta.1'
    }
    flavorDimensions += 'role'
    productFlavors {
        driver {
            dimension 'role'
            applicationId 'com.orya.parking.beta'
            buildConfigField 'boolean', 'OPERATIONS', 'false'
            buildConfigField 'String', 'APP_PATH', '"/mobile/driver"'
        }
        operations {
            dimension 'role'
            applicationId 'com.orya.operations.beta'
            buildConfigField 'boolean', 'OPERATIONS', 'true'
            buildConfigField 'String', 'APP_PATH', '"/mobile/operations"'
        }
    }
    buildTypes {
        release { minifyEnabled false; debuggable false }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
